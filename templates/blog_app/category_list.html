{% extends "blog_app/index.html" %}
{% block content %}
  <h2>Categorias</h2>
  <ul>
    {% for c in categories %}
      <li><a href="{% url 'category_detail' c.pk %}">{{ c.name }}</a>. {{ c.description }}</li>
    {% empty %}
      <li>Nenhuma categoria</li>
    {% endfor %}
  </ul>
{% endblock %}
