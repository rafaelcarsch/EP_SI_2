{% extends "index.html" %}
{% block content %}
  <h2>Adicionar comentário ao post: {{ post.title }}</h2>
  <form method="post">
    {% csrf_token %}
    <p><label>Comentário</label><br>
    <textarea name="text" rows="6"></textarea></p>
    <button type="submit">Enviar</button>
  </form>
{% endblock %}
